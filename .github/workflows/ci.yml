name: CI

on:
  push:
    branches: [main]
    paths:
      - "plugins/flow/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "plugins/flow/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: write

defaults:
  run:
    working-directory: plugins/flow

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the real PR branch (not the synthetic merge commit) so
          # the auto-commit step can push back to it. For push events
          # github.head_ref is empty and falls back to github.ref (main).
          ref: ${{ github.head_ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: plugins/flow/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Bloat gate — fail on dead files, unused exports, or unused deps (knip)
        run: pnpm knip
      - name: Lint — fail on unused imports and unreachable code (oxlint)
        run: pnpm lint
      - name: Typecheck — fail on unused locals, parameters, and type errors
        run: pnpm typecheck
      - run: pnpm build
      - name: Auto-commit rebuilt dist if dirty (PR only)
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet mcp-server/dist; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add mcp-server/dist
            git commit -m "chore(ci): rebuild dist [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Verify committed dist/ matches fresh build (main only)
        if: github.event_name == 'push'
        run: git diff --exit-code mcp-server/dist
      - run: pnpm test
      - name: Coverage — fail if overall coverage drops below committed baseline
        run: |
          cd mcp-server
          pnpm test:coverage 2>&1 | tee /tmp/coverage-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ "$EXIT_CODE" -ne 0 ]; then
            echo "::error::Coverage dropped below the committed baseline thresholds."
            echo "::error::Run 'pnpm test:coverage' locally to see the shortfall, then update the thresholds in vitest.config.ts if the drop is intentional."
            grep -E "Coverage threshold|threshold" /tmp/coverage-output.txt || true
            exit $EXIT_CODE
          fi
