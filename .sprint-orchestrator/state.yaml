stories:
  - id: "1"
    title: Orchestrator calls markDevReturned after dev Task returns (deadlock fix)
    status: done
    depends_on: []
    acceptance_criteria:
      checks:
        - type: shell
          cmd: grep -q "markDevReturned" plugins/sprint-orchestrator/skills/process-backlog/SKILL.md
          expect_exit: 0
        - type: shell
          cmd: pnpm --dir plugins/sprint-orchestrator e2e --grep "orchestrator marks dev returned even when
            dev subagent forgot"
          expect_exit: 0
        - type: shell
          cmd: pnpm --dir plugins/sprint-orchestrator e2e --grep "recordStoryFailure succeeds when dev
            produced zero output"
          expect_exit: 0
        - type: shell
          cmd: pnpm --dir plugins/sprint-orchestrator verify
          expect_exit: 0
        - type: shell
          cmd: pnpm --dir plugins/sprint-orchestrator e2e
          expect_exit: 0
    orchestrator:
      claimed_by: dev-shipgate-followups-s1
      claimed_at: 2026-05-15T00:02:44.196Z
      completed_at: 2026-05-15T00:10:16.200Z
      summary: Orchestrator now calls markDevReturned itself after every dev Task return, eliminating the
        deadlock where a silently-died dev subagent left the state machine unrecoverable; all 134
        e2e assertions pass.
      rework_count: 0
      base_branch: main
      dev_returned_at: 2026-05-15T00:08:17.635Z
      branch: 1-orchestrator-calls-markdevreturned-after
      branch_prepared_by: dev-shipgate-followups-s1
      branch_prepared_at: 2026-05-15T00:02:47.463Z
      artefacts:
        - git:0e55e405a6ce978391f0c720af10ae4bc39caebd
        - plugins/sprint-orchestrator/skills/process-backlog/SKILL.md
        - plugins/sprint-orchestrator/scripts/e2e.ts
        - plugins/sprint-orchestrator/agents/dev.md
    notes: >
      Problem: dev subagent is contractually required to call markDevReturned before returning, but
      in practice forgets — every reviewer call (recordStorySuccess / recordStoryFailure /
      recordStoryRework) is then refused by the AC-guard ("dev_returned_at is not set"), producing a
      hard deadlock with no API recovery path. We have hit this at least 3 times across separate
      sprint runs. The workaround (manually edit state.yaml) is unsafe and defeats the audit trail.


      Concrete actions:

      - process-backlog skill: after the dev Task returns (regardless of summary content), the
      orchestrator itself calls `markDevReturned(storyId, agentId)` BEFORE spawning the reviewer.
      The Task tool returning IS the "dev returned" signal — that is what the field is named after.
      The dev calling it themselves becomes belt-and-braces.

      - Update skill prose at plugins/sprint-orchestrator/skills/process-backlog/SKILL.md step 5 to
      add this call explicitly. Update dev agent prose to note that the orchestrator now handles
      this so the dev's own call is redundant but harmless.

      - New e2e mini-run: spawn a "dev" that produces zero output and does NOT call markDevReturned.
      The orchestrator's call should still let the reviewer fail the story cleanly via
      recordStoryFailure. No deadlock.

      - New e2e mini-run: even when dev did its own markDevReturned, the orchestrator's second call
      is idempotent — pick and document the contract (no-op vs. refresh timestamp).


      Definition of done: a sprint where the dev subagent silently dies mid-run can still have its
      story recorded as `failed` and the next ready story picked up. No manual state edits required.
  - id: "2"
